# Triggered by the approved §50 execution request on 2026-08-06.
name: Apply Kael Agentic Completeness implementation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kael-agentic-completeness-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'claude/kael-agentic-completeness-apply-20260806'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: claude/kael-agentic-completeness-d92bc8
      EXPECTED_HEAD: a5d13c87a6780f3e6eae9e4570bcccf6da5cda80
      PATCH_XZ_SHA256: 3f285a01908c7bc87553683fec7512878574297b3201a0a4a757adc1cf436934
      PATCH_SHA256: cf880275817b42c4fcbcf001d1985f03e7cc4642fa61af60ed4a8e175b3471ca
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert clean starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --short)"

      - name: Reconstruct implementation patch
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/patch.b64
          raw_blobs=(
            e004e946e81b16965673b5699bb5f07b681b9a6a
            e3079f2e741d615c610ed3e37c8acb5074abadf2
            e6e34bcf39e33bc9704dd203f51d6410bd3ef584
          )
          wrapped_blobs=(
            949052a8ac980f7779763b8741296c83bc7aa93a
            265a18cf89d1d71db6cad7dcc39f2e8ae9da6027
            20e985a9ecfe1a65d6278b9023285b21c612cdb8
            d693c034adf22fb9b8ebee368b9f31fad2e3708b
            9dfd3e2e2531dbe8c43bc8ee3113963ec567a17a
            7653f2543255bd3f27728d3b844c60d61a15ebed
            7352fadc6a821fb1187d5eff1804f743bb0e5d1e
          )
          for sha in "${raw_blobs[@]}"; do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq .content \
              | tr -d '\n' | base64 -d >> /tmp/patch.b64
          done
          for sha in "${wrapped_blobs[@]}"; do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq .content \
              | tr -d '\n' | base64 -d | jq -r .data >> /tmp/patch.b64
          done
          base64 -d /tmp/patch.b64 > /tmp/patch.xz
          echo "$PATCH_XZ_SHA256  /tmp/patch.xz" | sha256sum -c -
          xz -dc /tmp/patch.xz > /tmp/patch.diff
          echo "$PATCH_SHA256  /tmp/patch.diff" | sha256sum -c -
          echo "Patch paths: $(grep -c '^diff --git ' /tmp/patch.diff)"

      - name: Apply patch without destructive changes
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git apply --3way --index --whitespace=nowarn /tmp/patch.diff
          apply_status=$?
          set -e
          if [ "$apply_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Patch conflicts: %s\n' "${conflicts[*]:-none}"
            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != "package.json" ]; then
              printf 'Unexpected patch conflicts:\n%s\n' "${conflicts[*]:-none}" >&2
              exit 1
            fi
            git show :2:package.json > /tmp/package.ours.json
            git show :3:package.json > /tmp/package.theirs.json
            node <<'NODE'
          const fs = require('node:fs')
          const ours = JSON.parse(fs.readFileSync('/tmp/package.ours.json', 'utf8'))
          const theirs = JSON.parse(fs.readFileSync('/tmp/package.theirs.json', 'utf8'))
          const merged = {
            ...ours,
            ...theirs,
            scripts: { ...(ours.scripts ?? {}), ...(theirs.scripts ?? {}) },
            reactDoctor: { ...(ours.reactDoctor ?? {}), ...(theirs.reactDoctor ?? {}) },
            devDependencies: { ...(ours.devDependencies ?? {}), ...(theirs.devDependencies ?? {}) },
            workspaces: [...new Set([...(ours.workspaces ?? []), ...(theirs.workspaces ?? [])])],
          }
          fs.writeFileSync('package.json', `${JSON.stringify(merged, null, 2)}\n`)
          NODE
            git add package.json
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('config/env/workspace.env.example')
          text = path.read_text(encoding='utf-8')
          path.write_text(text.rstrip('\n') + '\n', encoding='utf-8')
          PY
          git add config/env/workspace.env.example
          unresolved="$(git diff --name-only --diff-filter=U)"
          printf 'Unresolved paths: %s\n' "${unresolved:-none}"
          test -z "$unresolved"
          git diff --cached --check
          if git diff --cached --name-status | grep -q '^D'; then
            echo 'Refusing to commit file deletions.' >&2
            exit 1
          fi
          patch_path_count="$(grep -c '^diff --git ' /tmp/patch.diff)"
          changed_count="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          echo "Staged changed file count: $changed_count / patch paths: $patch_path_count"
          test "$changed_count" = "$patch_path_count"
          locked='^(CLAUDE\.md|README\.md|governance/(STRUCTURES|RULES|critical|design)\.md)$'
          if git diff --cached --name-only | grep -Eq "$locked"; then
            echo 'Refusing to modify locked governance files.' >&2
            exit 1
          fi

      - name: Package staged source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --binary > /tmp/kael-stage.patch
          tar --exclude=.git --exclude=node_modules --exclude=.turbo -czf /tmp/kael-stage-source.tgz .

      - name: Upload staged source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kael-stage-source-${{ github.run_id }}
          path: |
            /tmp/kael-stage.patch
            /tmp/kael-stage-source.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run compile and test gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @nestscout/api type-check
          pnpm --filter @nestscout/mobile type-check
          pnpm --filter @nestscout/api test
          pnpm --filter @nestscout/mobile test
          node apps/api/scripts/kael-eval.mjs --mode deterministic --report docs/test-logs/2026-08-06_kael-eval.md
          test -f apps/api/scripts/kael-multi-turn-eval.mjs
          test -f apps/api/scripts/kael-model-health.mjs
          node apps/api/scripts/kael-multi-turn-eval.mjs
          node apps/api/scripts/kael-model-health.mjs
          node scripts/lint-structure.mjs
          node scripts/check-comment-discipline.mjs

      - name: Commit and push implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if git diff --cached --name-status | grep -q '^D'; then
            echo 'Refusing to commit file deletions.' >&2
            exit 1
          fi
          locked='^(CLAUDE\.md|README\.md|governance/(STRUCTURES|RULES|critical|design)\.md)$'
          if git diff --cached --name-only | grep -Eq "$locked"; then
            echo 'Refusing to modify locked governance files.' >&2
            exit 1
          fi
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git commit -m 'feat(kael): execute agentic completeness plan'
          git push origin "HEAD:${TARGET_BRANCH}"
