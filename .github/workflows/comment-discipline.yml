# Comment-discipline gate (governance/skills.md Core Skill 5).
# Blocks NEW note-banner comments (phase/plan/date/status/audit refs) on the
# lines a PR adds. Legacy files are grandfathered until touched — a going-forward
# ratchet, not a one-shot mass cleanup. Run `pnpm lint:comments` for a full report.
name: comment-discipline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comment-discipline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    name: no new note-banner comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Ensure base ref is available
        if: github.event_name == 'pull_request'
        run: git rev-parse --verify "refs/remotes/origin/${{ github.base_ref }}"
      - name: Check added lines (PR ratchet)
        if: github.event_name == 'pull_request'
        run: node scripts/check-comment-discipline.mjs --diff "origin/${{ github.base_ref }}"
      - name: Full-repo report (manual run)
        if: github.event_name != 'pull_request'
        run: node scripts/check-comment-discipline.mjs
