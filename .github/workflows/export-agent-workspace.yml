name: materialize-harness-assurance

on:
  pull_request:
    branches:
      - tmp/agent-export-base

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: feat/harness-production-assurance-pr02-pr12
          fetch-depth: 0
      - name: Materialize and verify implementation
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/harness/verify.mjs ]]; then
            echo "Implementation already materialized."
            exit 0
          fi
          cat .github/agent-patch/patch-[0-9][0-9][0-9] > /tmp/harness.patch.b64
          base64 --decode /tmp/harness.patch.b64 > /tmp/harness.patch.xz
          xz --test /tmp/harness.patch.xz
          xz --decompress --stdout /tmp/harness.patch.xz > /tmp/harness.patch
          sha256sum /tmp/harness.patch
          git apply --check /tmp/harness.patch
          git reset --hard d0f465c29d86a9aeb94992a58f990ea567657c4c
          git apply --index /tmp/harness.patch
          test -f scripts/harness/verify.mjs
          test -f .github/workflows/harness-assurance.yml
          node scripts/harness/verify.mjs
          git diff --cached --check
          git config user.name "manhtu0407"
          git config user.email "manhtu0407@gmail.com"
          tree_sha="$(git write-tree)"
          commit_sha="$(printf '%s\n\n%s\n' \
            'feat(harness): complete production assurance controls PR-02 through PR-12' \
            'Implement environment, authorization, privileged access, data policy, release, tracing, evaluation, learning, reliability, promotion, rollback, incident, and SLO controls.' \
            | git commit-tree "$tree_sha" -p d0f465c29d86a9aeb94992a58f990ea567657c4c)"
          git push --force origin "$commit_sha:refs/heads/feat/harness-production-assurance-pr02-pr12"
