name: Export Kael Section 50 Transport

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'tmp/kael-section50-materialize-20260807-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kael-section50-transport-${{ github.run_id }}
          path: .github/transport/kael-section50-part-*
          if-no-files-found: error
          retention-days: 1
