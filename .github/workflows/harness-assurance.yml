name: harness-assurance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-controls:
    name: manifest, environment, capability, release, evaluation, reliability, promotion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Harness assurance verification
        run: node scripts/harness/verify.mjs

  runtime-controls:
    name: API and Edge runtime controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API type-check
        run: pnpm --filter @nestscout/api type-check
      # Names only what apps/api/vitest.config.mts collects. The six files this step used to
      # list are outside the pillar glob, so they were never run and the step reported success
      # over them; docs/audit/test-collection-analysis-20260820.md records which layer carries
      # each invariant now. scripts/check-test-collection.mjs fails if a path is added back.
      - name: Harness runtime tests
        run: pnpm --filter @nestscout/api exec vitest run --passWithNoTests=false src/__tests__/harness
      - name: Edge function type-check
        run: node scripts/run.mjs docker/scripts/edge-check
      - name: Test collection ratchet
        run: node scripts/check-test-collection.mjs
      - name: Comment discipline
        run: node scripts/check-comment-discipline.mjs
      - name: Skill contract ratchet
        run: node scripts/check-skill-contracts.mjs
      - name: Runner parity ratchet
        run: node scripts/check-runner-parity.mjs
      - name: Design adapter ratchet
        run: node scripts/design/check-design-adapters.mjs
      - name: Structure ratchet
        run: node scripts/lint-structure.mjs

  workspace-gates:
    name: whole workspace type-check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Whole workspace type-check
        run: pnpm exec turbo --root-turbo-json config/turbo/turbo.json type-check
      - name: Whole workspace tests
        run: pnpm exec turbo --root-turbo-json config/turbo/turbo.json test
      - name: Whole workspace build
        run: pnpm exec turbo --root-turbo-json config/turbo/turbo.json build

  database-controls:
    name: empty reset, SQL actor matrix, and generated types
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare canonical empty-reset migration inventory
        run: |
          node scripts/harness/prepare-migration-workdir.mjs \
            --empty-reset \
            --inventory config/harness/migration-inventory.json \
            --output artifacts/empty-reset
      - name: Start local Supabase
        run: pnpm --filter @nestscout/api exec supabase --workdir artifacts/empty-reset start --exclude edge-runtime
      - name: Replay all migrations from empty state
        run: pnpm --filter @nestscout/api exec supabase --workdir artifacts/empty-reset db reset --local
      - name: Run SQL verification matrix
        env:
          NESTSCOUT_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: node scripts/run.mjs docker/scripts/run-sql-tests --stop-on-first-failure
      - name: Generate database types from replayed schema
        run: |
          pnpm --filter @nestscout/api exec supabase --workdir artifacts/empty-reset gen types typescript --local > /tmp/database.types.ts
          node -e "const fs = require('node:fs'); const path = '/tmp/database.types.ts'; const text = fs.readFileSync(path, 'utf8'); fs.writeFileSync(path, text.replace(/\\n+$/u, '\\n'))"
      - name: Upload generated database types
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-database-types
          path: /tmp/database.types.ts
          if-no-files-found: error
          retention-days: 1
      - name: Generated type drift check
        # The artifact is committed split across packages/shared/src/types/database/**.
        # Rejoining it and comparing bytes keeps this check exactly as strong as the
        # single-file cmp it replaces; --check-against only makes the failure readable.
        run: |
          node scripts/split-database-types.mjs --join > /tmp/rejoined.types.ts
          if ! cmp -s /tmp/rejoined.types.ts /tmp/database.types.ts; then
            echo "Generated database types differ from the committed split tree."
            node scripts/split-database-types.mjs --check-against /tmp/database.types.ts || true
            diff --unified=3 /tmp/rejoined.types.ts /tmp/database.types.ts | head -400 || true
            exit 1
          fi
      - name: Supabase schema lint
        run: pnpm --filter @nestscout/api exec supabase --workdir artifacts/empty-reset db lint --local --fail-on warning
      - name: Stop local Supabase
        if: always()
        run: pnpm --filter @nestscout/api exec supabase --workdir artifacts/empty-reset stop --no-backup
