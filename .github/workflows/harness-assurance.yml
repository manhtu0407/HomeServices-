name: harness-assurance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harness-assurance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: classify changed paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      backend: ${{ steps.classify.outputs.backend }}
      shared: ${{ steps.classify.outputs.shared }}
      database: ${{ steps.classify.outputs.database }}
      harness: ${{ steps.classify.outputs.harness }}
      sandbox: ${{ steps.classify.outputs.sandbox }}
      workspace: ${{ steps.classify.outputs.workspace }}
      workspace_full: ${{ steps.classify.outputs.workspace_full }}
      runtime: ${{ steps.classify.outputs.runtime }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - id: classify
        name: Classify dependency impact
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/harness/classify-ci-changes.mjs

  repository-controls:
    name: manifest, environment, capability, release, evaluation, reliability, promotion
    needs: changes
    if: ${{ needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Harness assurance verification
        run: node scripts/harness/verify.mjs
      - name: Structure baseline lock
        run: node scripts/check-structure-baseline.mjs

  governance-controls:
    name: source residue, protocol routes, work-router coverage, and script fixtures
    needs: changes
    if: ${{ needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fixture suites load TypeScript through the mobile workspace, so this job needs the
      # same frozen dependency graph as the other code-aware gates.
      - name: Source residue ratchet
        run: node scripts/check-source-residue.mjs
      - name: Protocol routing ratchet
        run: node scripts/check-protocol-routes.mjs
      - name: Work-router coverage ratchet
        run: node scripts/check-work-plan.mjs --coverage
      - name: Docker contract ratchet
        run: node scripts/check-docker-contracts.mjs
      - name: Script fixture suites
        run: node --test scripts/*.test.mjs scripts/harness/*.test.mjs

  runtime-controls:
    name: API and Edge runtime controls
    needs: changes
    if: ${{ needs.changes.outputs.runtime == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API type-check
        run: pnpm --filter @nestscout/api type-check
      # Names only what apps/api/vitest.config.mts collects. The six files this step used to
      # list are outside the pillar glob, so they were never run and the step reported success
      # over them; docs/audit/test-collection-analysis-20260820.md records which layer carries
      # each invariant now. scripts/check-test-collection.mjs fails if a path is added back.
      - name: Harness runtime tests
        run: pnpm --filter @nestscout/api exec vitest run --passWithNoTests=false src/__tests__/harness
      - name: Edge function type-check
        run: node scripts/run.mjs docker/scripts/edge-check
      - name: Test collection ratchet
        run: node scripts/check-test-collection.mjs
      - name: Comment discipline
        run: node scripts/check-comment-discipline.mjs
      - name: Skill contract ratchet
        run: node scripts/check-skill-contracts.mjs
      - name: Runner parity ratchet
        run: node scripts/check-runner-parity.mjs
      - name: Design adapter ratchet
        run: node scripts/design/check-design-adapters.mjs
      - name: Structure ratchet
        run: node scripts/lint-structure.mjs

  workspace-gates:
    name: affected workspace type-check, test, and build
    needs: changes
    if: ${{ needs.changes.outputs.workspace == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused mobile checks
        if: ${{ needs.changes.outputs.frontend == 'true' && needs.changes.outputs.workspace_full != 'true' }}
        run: |
          pnpm type-check:mobile
          pnpm test:mobile --runInBand
      - name: Focused API checks
        if: ${{ needs.changes.outputs.backend == 'true' && needs.changes.outputs.workspace_full != 'true' }}
        run: |
          pnpm type-check:api
          pnpm test:api
      - name: Focused sandbox checks
        if: ${{ needs.changes.outputs.sandbox == 'true' && needs.changes.outputs.workspace_full != 'true' }}
        run: |
          pnpm sandbox:type-check
          pnpm sandbox:test
      - name: Full affected workspace gates
        if: ${{ needs.changes.outputs.workspace_full == 'true' }}
        run: |
          pnpm exec turbo --root-turbo-json config/turbo/turbo.json type-check
          pnpm exec turbo --root-turbo-json config/turbo/turbo.json test
          pnpm exec turbo --root-turbo-json config/turbo/turbo.json build

  database-controls:
    name: empty reset, SQL actor matrix, and generated types
    needs: changes
    if: ${{ needs.changes.outputs.database == 'true' || needs.changes.outputs.harness == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare canonical empty-reset migration inventory
        run: |
          node scripts/harness/prepare-migration-workdir.mjs \
            --empty-reset \
            --inventory config/harness/migration-inventory.json \
            --output artifacts/empty-reset
      - name: Start local Supabase
        run: pnpm --filter @nestscout/api exec supabase --workdir "$GITHUB_WORKSPACE/artifacts/empty-reset" start --exclude edge-runtime
      - name: Record isolated Postgres image identity
        run: |
          mapfile -t databases < <(docker ps -q --filter 'name=^/supabase_db_')
          test "${#databases[@]}" -eq 1
          docker inspect --format '{{.Config.Image}} {{.Image}}' "${databases[0]}"
      - name: Replay all migrations from empty state
        run: pnpm --filter @nestscout/api exec supabase --workdir "$GITHUB_WORKSPACE/artifacts/empty-reset" db reset --local
      - name: Run SQL verification matrix
        env:
          NESTSCOUT_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        # Keep the existing matrix intact and report every failure in one CI pass.
        run: node scripts/run.mjs docker/scripts/run-sql-tests
      - name: Generate database types from replayed schema
        run: |
          pnpm --filter @nestscout/api exec supabase --workdir "$GITHUB_WORKSPACE/artifacts/empty-reset" gen types typescript --local > /tmp/database.types.ts
          node -e "const fs = require('node:fs'); const path = '/tmp/database.types.ts'; const text = fs.readFileSync(path, 'utf8'); fs.writeFileSync(path, text.replace(/\\n+$/u, '\\n'))"
      - name: Upload generated database types
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-database-types
          path: /tmp/database.types.ts
          if-no-files-found: error
          retention-days: 1
      - name: Generated type drift check
        # The artifact is committed split across packages/shared/src/types/database/**.
        # Rejoining it and comparing bytes keeps this check exactly as strong as the
        # single-file cmp it replaces; --check-against only makes the failure readable.
        run: |
          node scripts/split-database-types.mjs --join > /tmp/rejoined.types.ts
          if ! cmp -s /tmp/rejoined.types.ts /tmp/database.types.ts; then
            echo "Generated database types differ from the committed split tree."
            node scripts/split-database-types.mjs --check-against /tmp/database.types.ts || true
            diff --unified=3 /tmp/rejoined.types.ts /tmp/database.types.ts | head -400 || true
            exit 1
          fi
      - name: Supabase schema lint
        run: pnpm --filter @nestscout/api exec supabase --workdir "$GITHUB_WORKSPACE/artifacts/empty-reset" db lint --local --fail-on warning
      - name: Preserve isolated Postgres diagnostics on failure
        if: failure()
        run: |
          mkdir -p artifacts/database-diagnostics
          mapfile -t databases < <(docker ps -aq --filter 'name=^/supabase_db_')
          test "${#databases[@]}" -eq 1
          docker inspect --format '{{json .State}}' "${databases[0]}" > artifacts/database-diagnostics/state.json
          docker logs --tail 200 "${databases[0]}" > artifacts/database-diagnostics/postgres.log 2>&1
      - name: Upload isolated Postgres diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-diagnostics-${{ github.sha }}
          path: artifacts/database-diagnostics/
          if-no-files-found: warn
          retention-days: 3
      - name: Stop local Supabase
        if: always()
        run: pnpm --filter @nestscout/api exec supabase --workdir "$GITHUB_WORKSPACE/artifacts/empty-reset" stop --no-backup
