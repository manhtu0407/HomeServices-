# Integration pillar suite against the isolated local Supabase stack.
# The API runner collects only `*-pillar.test.ts`; the path filter keeps this workflow scoped
# to real-DB invariants under apps/api/src/__tests__/integration/.
name: integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly local contract check (01:00 ICT / 18:00 UTC).
    - cron: "0 18 * * *"

permissions:
  contents: read

# Cancel obsolete PR runs; keep main and scheduled local database runs serialized.
concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: classify changed paths
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.classify.outputs.integration }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - id: classify
        name: Classify dependency impact
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/harness/classify-ci-changes.mjs

  integration:
    name: integration suite (local)
    needs: changes
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.integration == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare canonical empty-reset migration workdir
        run: |
          node scripts/harness/prepare-migration-workdir.mjs \
            --empty-reset \
            --inventory config/harness/migration-inventory.json \
            --output .scratch/integration-migrations
      - name: Start isolated local Supabase
        run: pnpm --filter @nestscout/api exec supabase start --workdir ../../.scratch/integration-migrations
      - name: Replay migrations from empty state
        run: pnpm --filter @nestscout/api exec supabase db reset --local --workdir ../../.scratch/integration-migrations
      - name: Integration tests against local Supabase
        env:
          NESTSCOUT_ENVIRONMENT: local
          EXPECTED_GIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
        # Keep the explicit path and fail-on-empty flag together: the integration pillar must
        # remain collected, and this job must never report green after executing zero tests.
        run: pnpm --filter @nestscout/api exec vitest run --passWithNoTests=false src/__tests__/integration
