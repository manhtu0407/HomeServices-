name: Release audited Kael Agentic Completeness branch

on:
  push:
    branches:
      - claude/kael-agentic-completeness-apply-20260806
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kael-agentic-completeness-audited-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_BRANCH: claude/kael-agentic-completeness-final-v3-20260807
      RELEASE_BRANCH: claude/kael-agentic-completeness-audited-20260807
    steps:
      - name: Check out final implementation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify product diff boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          base="$(git merge-base origin/main HEAD)"
          files="$(git diff --name-only "$base"..HEAD)"
          test "$(printf '%s\n' "$files" | sed '/^$/d' | wc -l | tr -d ' ')" -ge 35
          test "$(printf '%s\n' "$files" | grep -Ec '^(apps/|packages/|supabase/|config/|docs/)')" -ge 25
          test -n "$(printf '%s\n' "$files" | grep '^apps/mobile/')"
          test -n "$(printf '%s\n' "$files" | grep '^apps/api/')"
          test -n "$(printf '%s\n' "$files" | grep '^supabase/functions/')"
          test -n "$(printf '%s\n' "$files" | grep '^supabase/migrations/')"
          if git diff --name-status "$base"..HEAD | grep -q '^D'; then exit 1; fi
          if printf '%s\n' "$files" | grep -Eq '^(CLAUDE\.md|README\.md|governance/(STRUCTURES|RULES|critical|design)\.md)$'; then exit 1; fi
          test -z "$(git diff --name-only "$base"..HEAD -- apps/api/src/app/admin/kael-learning)"
          echo "$base" >/tmp/merge-base.txt
          git diff --stat "$base"..HEAD >/tmp/diff-stat.txt
          git diff --name-status "$base"..HEAD >/tmp/diff-files.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all required TypeScript gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @nestscout/api type-check
          pnpm --filter @nestscout/shared type-check
          pnpm --filter @nestscout/mobile type-check
          pnpm --filter @nestscout/sandbox type-check

      - name: Run all required tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @nestscout/api test
          pnpm --filter @nestscout/shared test
          pnpm --filter @nestscout/mobile test
          pnpm --filter @nestscout/sandbox test

      - name: Run Kael and governance gates
        shell: bash
        run: |
          set -euo pipefail
          node apps/api/scripts/kael-eval.mjs --mode deterministic --report /tmp/kael-eval.md
          node apps/api/scripts/kael-multi-turn-eval.mjs
          if node apps/api/scripts/kael-model-health.mjs >/tmp/model-health.log 2>&1; then
            echo 'Missing-key model health guard unexpectedly succeeded.' >&2
            exit 1
          fi
          grep -Eqi 'credential|provider' /tmp/model-health.log
          node scripts/check-comment-discipline.mjs
          node scripts/lint-structure.mjs
          node scripts/check-skills-sync.mjs

      - name: Run pinned Deno Edge gates
        shell: bash
        run: |
          set -euo pipefail
          image='denoland/deno:2.9.4@sha256:c777b4b225501a61074837e90a826a58f99124837824023cd60334b1e2374498'
          for fn in kael-learning-monitor kael-media-retention mobile-api sepay-webhook; do
            docker run --rm -v "$PWD:/repo" -w /repo "$image" \
              deno check --config "supabase/functions/$fn/deno.json" "supabase/functions/$fn/index.ts"
          done

      - name: Record exact audited release result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/test-logs
          {
            echo '# Kael §50 audited release'
            echo
            echo "- Source branch: \`$SOURCE_BRANCH\`"
            echo "- Source commit: \`$(git rev-parse HEAD)\`"
            echo "- Main merge base: \`$(cat /tmp/merge-base.txt)\`"
            echo "- Audited at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '## Passed gates'
            echo '- API/shared/mobile/sandbox TypeScript checks'
            echo '- API/shared/mobile/sandbox test suites'
            echo '- Deterministic Kael evaluation'
            echo '- Multi-turn Kael evaluation'
            echo '- Model-health missing-key refusal'
            echo '- Comment discipline, structure, and skill synchronization'
            echo '- Pinned Deno checks for all configured Edge Functions'
            echo '- No tracked deletion, no locked governance change, no edit to admin/kael-learning'
            echo
            echo '## Diff stat'
            echo '```text'
            cat /tmp/diff-stat.txt
            echo '```'
            echo
            echo '## Diff files'
            echo '```text'
            cat /tmp/diff-files.txt
            echo '```'
            echo
            echo '## Not executed by design'
            echo '- No live Supabase migration apply.'
            echo '- No paid live eval or live red-team request.'
            echo '- No secret value committed.'
          } >docs/test-logs/2026-08-07_kael-audited-release.md
          git add docs/test-logs/2026-08-07_kael-audited-release.md
          git diff --cached --check
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git commit -m 'test(kael): record audited §50 release'
          git push --force-with-lease origin "HEAD:$RELEASE_BRANCH"

      - name: Open or update final review PR
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$RELEASE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          cat >/tmp/body.md <<'BODY'
          Final audited implementation of §50 Kael Agentic Completeness.

          This branch was published only after all configured workspace type-checks/tests, deterministic and multi-turn evaluation, model-health missing-key behavior, repository governance gates, pinned Deno Edge checks, and diff-safety checks passed.

          Exact diff files and audit evidence are committed in `docs/test-logs/2026-08-07_kael-audited-release.md`.

          Deliberately excluded: staging/production Supabase migration apply, paid live eval/red-team calls, and secret values.
          BODY
          if test -n "$existing"; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --title 'feat(kael): audited Agentic Completeness §50' --body-file /tmp/body.md
            pr="$existing"
          else
            pr="$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$RELEASE_BRANCH" --base main --title 'feat(kael): audited Agentic Completeness §50' --body-file /tmp/body.md --json number --jq .number)"
          fi
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file docs/test-logs/2026-08-07_kael-audited-release.md
