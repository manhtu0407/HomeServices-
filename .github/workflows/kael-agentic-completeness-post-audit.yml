name: Post-audit Kael Agentic Completeness

on:
  push:
    branches:
      - claude/kael-agentic-completeness-apply-20260806
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: kael-agentic-completeness-post-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: claude/kael-agentic-completeness-final-v3-20260807
      HELPER_PR: '153'
    steps:
      - name: Check out final implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Prove this is a product-code branch
        id: shape
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          merge_base="$(git merge-base origin/main HEAD)"
          changed="$(git diff --name-only "$merge_base"..HEAD)"
          changed_count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          product_count="$(printf '%s\n' "$changed" | grep -Ec '^(apps/|packages/|supabase/|config/|docs/)' || true)"
          helper_count="$(printf '%s\n' "$changed" | grep -Ec '^\.github/(kael-agentic-trigger|workflows/apply-kael-agentic-completeness|workflows/kael-agentic-completeness-finalize)' || true)"
          test "$changed_count" -ge 35
          test "$product_count" -ge 25
          test "$helper_count" -eq 0
          test -n "$(printf '%s\n' "$changed" | grep '^supabase/functions/' || true)"
          test -n "$(printf '%s\n' "$changed" | grep '^apps/mobile/' || true)"
          test -n "$(printf '%s\n' "$changed" | grep '^apps/api/' || true)"
          test -n "$(printf '%s\n' "$changed" | grep '^supabase/migrations/' || true)"
          if git diff --name-status "$merge_base"..HEAD | grep -q '^D'; then
            echo 'Tracked deletion detected.' >&2
            exit 1
          fi
          locked='^(CLAUDE\.md|README\.md|governance/(STRUCTURES|RULES|critical|design)\.md)$'
          if printf '%s\n' "$changed" | grep -Eq "$locked"; then
            echo 'Locked governance file changed.' >&2
            exit 1
          fi
          {
            echo "merge_base=$merge_base"
            echo "changed_count=$changed_count"
            echo "product_count=$product_count"
          } >> "$GITHUB_OUTPUT"
          git diff --stat "$merge_base"..HEAD | tee /tmp/diff-stat.log
          git diff --name-status "$merge_base"..HEAD | tee /tmp/diff-files.log

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run core gates and capture exact results
        id: gates
        shell: bash
        run: |
          set +e
          failed=0
          : >/tmp/gates.md
          run_gate() {
            name="$1"
            shift
            safe="$(printf '%s' "$name" | tr ' /:' '___')"
            log="/tmp/${safe}.log"
            start="$(date +%s)"
            "$@" >"$log" 2>&1
            code=$?
            duration=$(( $(date +%s) - start ))
            if test "$code" -eq 0; then
              printf -- '- ✅ `%s` — %ss\n' "$name" "$duration" >>/tmp/gates.md
            else
              failed=1
              printf -- '- ❌ `%s` — exit %s, %ss\n' "$name" "$code" "$duration" >>/tmp/gates.md
              printf '\n<details><summary>%s log tail</summary>\n\n```text\n' "$name" >>/tmp/gates.md
              tail -n 80 "$log" >>/tmp/gates.md
              printf '\n```\n</details>\n' >>/tmp/gates.md
            fi
          }

          run_gate 'type-check:api' pnpm --filter @nestscout/api type-check
          run_gate 'type-check:shared' pnpm --filter @nestscout/shared type-check
          run_gate 'type-check:mobile' pnpm --filter @nestscout/mobile type-check
          run_gate 'type-check:sandbox' pnpm --filter @nestscout/sandbox type-check
          run_gate 'test:api' pnpm --filter @nestscout/api test
          run_gate 'test:shared' pnpm --filter @nestscout/shared test
          run_gate 'test:mobile' pnpm --filter @nestscout/mobile test
          run_gate 'test:sandbox' pnpm --filter @nestscout/sandbox test
          run_gate 'kael:eval deterministic' node apps/api/scripts/kael-eval.mjs --mode deterministic --report /tmp/kael-eval.md
          run_gate 'kael:eval multi-turn' node apps/api/scripts/kael-multi-turn-eval.mjs
          run_gate 'lint:comments' node scripts/check-comment-discipline.mjs
          run_gate 'lint:structure' node scripts/lint-structure.mjs
          run_gate 'skills:check' node scripts/check-skills-sync.mjs

          node apps/api/scripts/kael-model-health.mjs >/tmp/model-health.log 2>&1
          health_code=$?
          if test "$health_code" -ne 0 && grep -Eqi 'credential|provider' /tmp/model-health.log; then
            printf -- '- ✅ `kael:model-health missing-key guard` — refused clearly (exit %s)\n' "$health_code" >>/tmp/gates.md
          else
            failed=1
            printf -- '- ❌ `kael:model-health missing-key guard` — unexpected result (exit %s)\n' "$health_code" >>/tmp/gates.md
            cat /tmp/model-health.log >>/tmp/gates.md
          fi
          echo "failed=$failed" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Run pinned Deno Edge checks
        id: edge
        shell: bash
        run: |
          set +e
          failed=0
          : >/tmp/edge.md
          image='denoland/deno:2.9.4@sha256:c777b4b225501a61074837e90a826a58f99124837824023cd60334b1e2374498'
          for fn in kael-learning-monitor kael-media-retention mobile-api sepay-webhook; do
            log="/tmp/edge-${fn}.log"
            docker run --rm -v "$PWD:/repo" -w /repo "$image" \
              deno check --config "supabase/functions/$fn/deno.json" "supabase/functions/$fn/index.ts" >"$log" 2>&1
            code=$?
            if test "$code" -eq 0; then
              printf -- '- ✅ `edge:check %s`\n' "$fn" >>/tmp/edge.md
            else
              failed=1
              printf -- '- ❌ `edge:check %s` — exit %s\n\n```text\n' "$fn" "$code" >>/tmp/edge.md
              tail -n 80 "$log" >>/tmp/edge.md
              printf '\n```\n' >>/tmp/edge.md
            fi
          done
          echo "failed=$failed" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Build auditable report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/test-logs
          {
            echo '# Kael §50 final implementation audit'
            echo
            echo "- Branch: \`$TARGET_BRANCH\`"
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo "- Main merge base: \`${{ steps.shape.outputs.merge_base }}\`"
            echo "- Changed files: ${{ steps.shape.outputs.changed_count }}"
            echo "- Product-path files: ${{ steps.shape.outputs.product_count }}"
            echo "- Audit time (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '## Gates'
            cat /tmp/gates.md 2>/dev/null || true
            cat /tmp/edge.md 2>/dev/null || true
            echo
            echo '## Diff stat'
            echo '```text'
            cat /tmp/diff-stat.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Changed files'
            echo '```text'
            cat /tmp/diff-files.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Intentionally not executed'
            echo '- No staging or production Supabase migration apply.'
            echo '- No paid live evaluation or live red-team call.'
            echo '- No secret values were committed.'
          } >docs/test-logs/2026-08-07_kael-final-implementation-audit.md

      - name: Publish successful audit to implementation branch
        if: steps.gates.outputs.failed == '0' && steps.edge.outputs.failed == '0'
        shell: bash
        run: |
          set -euo pipefail
          git add docs/test-logs/2026-08-07_kael-final-implementation-audit.md
          git diff --cached --check
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          if ! git diff --cached --quiet; then
            git commit -m 'test(kael): record final §50 audit results'
            git push origin "HEAD:$TARGET_BRANCH"
          fi

      - name: Create or update implementation PR after successful audit
        if: steps.gates.outputs.failed == '0' && steps.edge.outputs.failed == '0'
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          cat >/tmp/body.md <<'BODY'
          Completes §50 Kael Agentic Completeness with product code from current `main`.

          The branch has passed an independent post-build audit covering all workspace type-checks/tests, deterministic and multi-turn Kael evaluation, model-health missing-key behavior, comment/structure/skills gates, pinned Deno Edge checks, and no-deletion/locked-file diff checks.

          The exact gate results, diff stat, and changed-file list are committed at `docs/test-logs/2026-08-07_kael-final-implementation-audit.md`.

          Intentionally excluded: staging/production Supabase migration apply, paid live evaluation/red-team calls, and secret values.
          BODY
          if test -n "$existing"; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --title 'feat(kael): complete Agentic Completeness §50' --body-file /tmp/body.md
            pr="$existing"
          else
            pr="$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --title 'feat(kael): complete Agentic Completeness §50' --body-file /tmp/body.md --json number --jq .number)"
          fi
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file docs/test-logs/2026-08-07_kael-final-implementation-audit.md

      - name: Report failed audit on helper PR
        if: steps.gates.outputs.failed != '0' || steps.edge.outputs.failed != '0' || failure()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## §50 post-audit is not green yet'
            echo
            echo "Target branch: \`$TARGET_BRANCH\`"
            echo "Target commit: \`$(git rev-parse HEAD 2>/dev/null || echo unavailable)\`"
            echo
            cat /tmp/gates.md 2>/dev/null || true
            cat /tmp/edge.md 2>/dev/null || true
            echo
            echo 'No implementation success is claimed and no live Supabase project was touched.'
          } >/tmp/failure-comment.md
          gh pr comment "$HELPER_PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/failure-comment.md

      - name: Upload complete diagnostics when not green
        if: steps.gates.outputs.failed != '0' || steps.edge.outputs.failed != '0' || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kael-post-audit-diagnostics-${{ github.run_id }}
          path: |
            /tmp/*.log
            /tmp/*.md
            docs/test-logs/2026-08-07_kael-final-implementation-audit.md
          if-no-files-found: warn
          retention-days: 3

      - name: Fail when any audit gate failed
        shell: bash
        run: |
          test "${{ steps.gates.outputs.failed }}" = '0'
          test "${{ steps.edge.outputs.failed }}" = '0'
