name: kael-agentic-completeness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-runtime:
    name: type-check, tests, eval, and Edge checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check all workspaces
        run: |
          pnpm --filter @nestscout/api type-check
          pnpm --filter @nestscout/shared type-check
          pnpm --filter @nestscout/mobile type-check
          pnpm --filter @nestscout/sandbox type-check
      - name: Run all workspace tests
        run: |
          pnpm --filter @nestscout/api test
          pnpm --filter @nestscout/shared test
          pnpm --filter @nestscout/mobile test
          pnpm --filter @nestscout/sandbox test
      - name: Run deterministic Kael evaluations
        run: |
          node apps/api/scripts/kael-eval.mjs --mode deterministic --report /tmp/kael-eval.md
          node apps/api/scripts/kael-multi-turn-eval.mjs
      - name: Verify live tooling refuses unsafe or incomplete configuration
        run: |
          node apps/api/scripts/kael-model-health.mjs --list
          node apps/api/scripts/kael-model-health.mjs --self-test
          if node apps/api/scripts/kael-model-health.mjs >/tmp/model-health.log 2>&1; then
            cat /tmp/model-health.log
            echo 'model-health must refuse live I/O without credentials' >&2
            exit 1
          fi
          grep -E 'Missing .*API_KEY' /tmp/model-health.log
          if node apps/api/scripts/kael-live-redteam.mjs >/tmp/live-redteam.log 2>&1; then
            cat /tmp/live-redteam.log
            echo 'live red-team must require explicit opt-in' >&2
            exit 1
          fi
          grep -F 'KAEL_REDTEAM_RUN_LIVE=yes' /tmp/live-redteam.log
      - name: Run repository ratchets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-comment-discipline.mjs --diff "origin/${{ github.base_ref }}"
          else
            node scripts/check-comment-discipline.mjs
          fi
          node scripts/check-skills-sync.mjs
          node scripts/check-skill-contracts.mjs
          node scripts/check-runner-parity.mjs
          node scripts/lint-structure.mjs
      - name: Run pinned Deno checks
        run: |
          image='denoland/deno:2.9.4@sha256:c777b4b225501a61074837e90a826a58f99124837824023cd60334b1e2374498'
          for fn in kael-learning-monitor kael-matching-maintainer kael-media-retention mobile-api sepay-webhook; do
            docker run --rm -v "$PWD:/repo" -w /repo "$image" \
              deno check --config "supabase/functions/$fn/deno.json" "supabase/functions/$fn/index.ts"
          done
      - name: Confirm protected boundaries
        if: github.event_name == 'pull_request'
        run: |
          test -z "$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- apps/api/src/app/admin/kael-learning)"
          while IFS= read -r deleted_file; do
            case "$deleted_file" in
              'apps/mobile/app/(admin)/dashboard.tsx'|'apps/mobile/app/(admin)/__tests__/admin-dashboard-test.tsx')
                ;;
              # Replaced, not dropped: the generated artifact now lives split across
              # packages/shared/src/types/database/**, and scripts/split-database-types.mjs
              # rejoins it byte for byte. Drops out of this list once the split is on main.
              'packages/shared/src/types/database.types.ts')
                ;;
              # Removing a test is a reviewable act, not a silent one: the diff
              # shows it and docs/test-debt-ledger.md records what each removal
              # gave up. Unlisted product code, the admin surface, and every other
              # tracked path stay blocked by the catch-all below.
              apps/api/src/__tests__/*|packages/shared/src/__tests__/*)
                ;;
              # Retired UI surfaces/assets are intentionally removed by this
              # publication and replaced by the current production surfaces.
              # Keep the exception exact so unrelated product deletions remain blocked.
              'apps/mobile/assets/lottie/nestscout-aurora-nest-approved-logo-transparent.png'|\
              'apps/mobile/assets/lottie/nestscout-aurora-nest-north-star-awakening.json'|\
              'apps/mobile/components/auth/entry-access/lottie-logo-mark.tsx'|\
              'apps/mobile/components/customer/ui/payment-styles.ts'|\
              'apps/mobile/components/customer/ui/payment-surfaces.tsx'|\
              'apps/mobile/components/kael/kael-svg-lottie-view.tsx'|\
              'apps/mobile/components/worker/earnings/overview-styles.ts'|\
              'apps/mobile/components/worker/earnings/overview-surfaces.tsx'|\
              'apps/mobile/components/worker/earnings/salary-assets.ts'|\
              'apps/mobile/components/worker/home/opportunity-styles.ts'|\
              'apps/mobile/components/worker/home/opportunity-surfaces.tsx'|\
              'apps/mobile/components/worker/jobs/acceptance-styles.ts'|\
              'apps/mobile/components/worker/jobs/acceptance-surfaces.tsx'|\
              'apps/mobile/components/worker/jobs/completion-bodies.tsx'|\
              'apps/mobile/components/worker/jobs/completion-evidence-screen-body.tsx'|\
              'apps/mobile/components/worker/jobs/inbox-offer-surfaces.tsx'|\
              'apps/mobile/components/worker/jobs/offer-styles.ts'|\
              'apps/mobile/components/worker/jobs/offer-surfaces.tsx'|\
              'apps/mobile/components/worker/jobs/worker-jobs-legacy-prototype-body.tsx'|\
              'apps/mobile/components/worker/jobs/worker-jobs-legacy-prototype-contracts.ts'|\
              'apps/mobile/components/worker/jobs/worker-jobs-legacy-prototype-host.tsx'|\
              'apps/mobile/components/worker/jobs/worker-jobs-legacy-prototype-offer-route.tsx'|\
              'apps/mobile/components/worker/jobs/worker-jobs-legacy-prototype-opportunity.tsx'|\
              'apps/mobile/components/worker/jobs/worker-jobs-legacy-prototype-settlement.tsx'|\
              'apps/mobile/components/worker/jobs/worker-jobs-legacy-prototype-shared.tsx'|\
              'apps/mobile/components/worker/jobs/worker-jobs-legacy-prototype-stages.tsx'|\
              'apps/mobile/components/worker/jobs/worker-jobs-legacy-prototype-style-part-a.ts'|\
              'apps/mobile/components/worker/jobs/worker-jobs-legacy-prototype-style-part-b.ts'|\
              'apps/mobile/components/worker/jobs/worker-jobs-legacy-prototype-styles.ts'|\
              'apps/mobile/components/worker/jobs/worker-jobs-legacy-prototype-surface.tsx')
                ;;
              '')
                ;;
              *)
                echo "tracked file deletion detected: $deleted_file" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only --diff-filter=D "origin/${{ github.base_ref }}"...HEAD)
