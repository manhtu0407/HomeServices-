name: materialize-clean-harness

on:
  push:
    branches:
      - tmp/harness-clean-materialize-20260807

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: tmp/harness-clean-materialize-20260807
          fetch-depth: 0
      - name: Download, verify, apply, and push clean implementation
        shell: bash
        env:
          BRIDGE_TOKEN: bridge_6e8b2b6d4e5c4a96a81f0c3996bc2fd91c384a2ea9d843f39f9e37214ca4d512
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "x-agent-patch-token: $BRIDGE_TOKEN" \
            "https://xyylanuyflrjzbjzhqfl.supabase.co/functions/v1/agent-patch-bridge-temp" \
            > /tmp/harness.patch.xz.b64
          test "$(wc -c < /tmp/harness.patch.xz.b64)" -eq 155500
          base64 --decode /tmp/harness.patch.xz.b64 > /tmp/harness.patch.xz
          echo "05e915559174c0f8718b9d4b41446a9c3c8ce46552810a5846c5e23029691921  /tmp/harness.patch.xz" | sha256sum -c -
          xz --test /tmp/harness.patch.xz
          xz --decompress --stdout /tmp/harness.patch.xz > /tmp/harness.patch
          echo "1ffc9f4dd1e8b9e72ff4ac9976f21d059177f1b5a943de0e7d2ef8a47c9dbbe4  /tmp/harness.patch" | sha256sum -c -
          git reset --hard d0f465c29d86a9aeb94992a58f990ea567657c4c
          git apply --check /tmp/harness.patch
          git apply --index /tmp/harness.patch
          test "$(git diff --cached --name-only | wc -l)" -eq 110
          test -s scripts/harness/verify.mjs
          test -f .github/workflows/harness-assurance.yml
          if git diff --cached --name-only | grep -E '^\.github/(agent-patch|materialize-|workflows/materialize|workflows/export-agent)'; then
            echo "temporary transport path leaked into implementation tree" >&2
            exit 1
          fi
          node scripts/harness/verify.mjs
          git diff --cached --check
          git config user.name "manhtu0407"
          git config user.email "manhtu0407@gmail.com"
          tree_sha="$(git write-tree)"
          commit_sha="$(printf '%s\n\n%s\n' \
            'feat(harness): complete production assurance controls PR-02 through PR-12' \
            'Implement environment, authorization, privileged access, data policy, release, tracing, evaluation, learning, reliability, promotion, rollback, incident, and SLO controls.' \
            | git commit-tree "$tree_sha" -p d0f465c29d86a9aeb94992a58f990ea567657c4c)"
          git push --force origin "$commit_sha:refs/heads/feat/harness-production-assurance-pr02-pr12"
          curl --fail --silent --show-error -X DELETE \
            -H "x-agent-patch-token: $BRIDGE_TOKEN" \
            "https://xyylanuyflrjzbjzhqfl.supabase.co/functions/v1/agent-patch-bridge-temp" || true
          echo "materialized_commit=$commit_sha" >> "$GITHUB_STEP_SUMMARY"
