name: Materialize Kael Agentic Completeness Section 50 PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: kael-section50-materialize-pr-v2
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'tmp/kael-section50-materialize-20260807-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE_SHA: 81e5cda85a3928b8540e103774a6049dfdc6bf65
      FINAL_BRANCH: feat/kael-agentic-completeness-section50-final-v2
      EXPECTED_FILES: '83'
      PATCH_XZ_SHA256: 7aec8b767e6e05fa8472e070c91417dc1f649bb61f3a8b28e5e9b55d134ccd2d
      PATCH_SHA256: e70939231b85308a4c744199d7ae3ed081b93f2fa7fa634695a0e9be5acd5114
    steps:
      - name: Check out transport branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/transport/kael-section50-part-* > /tmp/kael-section50.patch.xz.b64
          cp .github/transport/kael-section50-fix-01.patch /tmp/kael-section50-fix-01.patch
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/kael-section50.patch.xz.b64')
          data = path.read_bytes()
          if len(data) == 66447:
              data = data[:8497] + b'l' + data[8497:]
          if len(data) != 66448:
              raise SystemExit(f'unexpected transport length: {len(data)}')
          path.write_bytes(data)
          PY
          base64 --decode /tmp/kael-section50.patch.xz.b64 > /tmp/kael-section50.patch.xz
          echo "$PATCH_XZ_SHA256  /tmp/kael-section50.patch.xz" | sha256sum -c -
          xz --test /tmp/kael-section50.patch.xz
          xz --decompress --stdout /tmp/kael-section50.patch.xz > /tmp/kael-section50.patch
          echo "$PATCH_SHA256  /tmp/kael-section50.patch" | sha256sum -c -
          test "$(grep -c '^diff --git ' /tmp/kael-section50.patch)" = "$EXPECTED_FILES"

      - name: Apply patch to exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git reset --hard "$BASE_SHA"
          git apply --check /tmp/kael-section50.patch
          git apply --index --whitespace=nowarn /tmp/kael-section50.patch
          git apply --check /tmp/kael-section50-fix-01.patch
          git apply --index --whitespace=nowarn /tmp/kael-section50-fix-01.patch
          git diff --cached --check

      - name: Enforce implementation boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "$EXPECTED_FILES"
          if git diff --cached --name-status | grep -q '^D'; then
            echo 'Tracked file deletion detected.' >&2
            exit 1
          fi
          locked='^(CLAUDE\.md|README\.md|governance/(STRUCTURES|RULES|critical|design)\.md)$'
          if git diff --cached --name-only | grep -Eq "$locked"; then
            echo 'Locked governance file modified.' >&2
            exit 1
          fi
          test -z "$(git diff --cached --name-only -- apps/api/src/app/admin/kael-learning)"
          if git diff --cached --name-only | grep -Eq '^\.github/transport/|materialize-kael-section50'; then
            echo 'Transport file leaked into implementation tree.' >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check all workspaces
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @nestscout/api type-check
          pnpm --filter @nestscout/shared type-check
          pnpm --filter @nestscout/mobile type-check
          pnpm --filter @nestscout/sandbox type-check

      - name: Test all workspaces
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @nestscout/api test
          pnpm --filter @nestscout/shared test
          pnpm --filter @nestscout/mobile test
          pnpm --filter @nestscout/sandbox test

      - name: Run Kael evaluation and safety gates
        shell: bash
        run: |
          set -euo pipefail
          node apps/api/scripts/kael-eval.mjs --mode deterministic --report /tmp/kael-eval.md
          node apps/api/scripts/kael-multi-turn-eval.mjs
          node apps/api/scripts/kael-model-health.mjs --list
          node apps/api/scripts/kael-model-health.mjs --self-test
          if node apps/api/scripts/kael-model-health.mjs >/tmp/model-health.log 2>&1; then
            cat /tmp/model-health.log
            echo 'model-health must reject live I/O without credentials' >&2
            exit 1
          fi
          grep -E 'Missing .*API_KEY' /tmp/model-health.log
          if node apps/api/scripts/kael-live-redteam.mjs >/tmp/live-redteam.log 2>&1; then
            cat /tmp/live-redteam.log
            echo 'live red-team must require explicit opt-in' >&2
            exit 1
          fi
          grep -F 'KAEL_REDTEAM_RUN_LIVE=yes' /tmp/live-redteam.log

      - name: Run repository ratchets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-comment-discipline.mjs --working
          node scripts/check-skills-sync.mjs
          node scripts/lint-structure.mjs

      - name: Run pinned Deno Edge checks
        shell: bash
        run: |
          set -euo pipefail
          image='denoland/deno:2.9.4@sha256:c777b4b225501a61074837e90a826a58f99124837824023cd60334b1e2374498'
          for fn in kael-learning-monitor kael-media-retention mobile-api sepay-webhook; do
            docker run --rm -v "$PWD:/repo" -w /repo "$image" \
              deno check --config "supabase/functions/$fn/deno.json" "supabase/functions/$fn/index.ts"
          done

      - name: Commit and push clean implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "$EXPECTED_FILES"
          if git diff --cached --name-status | grep -q '^D'; then
            echo 'Tracked file deletion detected before commit.' >&2
            exit 1
          fi
          locked='^(CLAUDE\.md|README\.md|governance/(STRUCTURES|RULES|critical|design)\.md)$'
          if git diff --cached --name-only | grep -Eq "$locked"; then
            echo 'Locked governance file modified before commit.' >&2
            exit 1
          fi
          test -z "$(git diff --cached --name-only -- apps/api/src/app/admin/kael-learning)"
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git commit -m 'feat(kael): complete Agentic Completeness section 50'
          git push origin "HEAD:refs/heads/${FINAL_BRANCH}"
          echo "implementation_commit=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "implementation_branch=${FINAL_BRANCH}" >> "$GITHUB_STEP_SUMMARY"
