name: Plan 55 single Production service

on:
  workflow_call:
    inputs:
      service:
        description: One service in the fixed Plan 55 order
        required: true
        type: string
      source_sha:
        description: Exact merged Production source SHA
        required: true
        type: string
      release_artifact_id:
        description: Immutable artifact containing the verified deployed release identity
        required: true
        type: string
      prior_artifact_ids:
        description: Immutable artifacts for all prior completed services
        required: false
        default: ''
        type: string
    outputs:
      canary_artifact_id:
        description: Immutable artifact containing this service's checkpoint and evidence
        value: ${{ jobs.canary.outputs.artifact_id }}

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: plan55-production-canary-${{ github.repository }}
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    env:
      PRODUCTION_PROJECT_REF: iwevizmsedyqozxlawwl
      PRODUCTION_PROJECT_URL: https://iwevizmsedyqozxlawwl.supabase.co
    outputs:
      artifact_id: ${{ steps.service-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ inputs.release_artifact_id }}
          path: artifacts/release
      - name: Find this service's latest checkpoint and all earlier start markers
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN55_SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          const service = process.env.PLAN55_SERVICE
          const runId = process.env.GITHUB_RUN_ID
          const attempt = Number(process.env.GITHUB_RUN_ATTEMPT)
          if (!/^(hvac|handyman|cleaning|upholstery|plumbing|electrical)$/.test(service ?? '') ||
              !/^\d+$/.test(runId ?? '') || !Number.isSafeInteger(attempt) || attempt < 1 ||
              !/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(process.env.GITHUB_REPOSITORY ?? '')) {
            process.stderr.write('plan55_resume_identity_invalid\n')
            process.exit(1)
          }
          try {
            const artifacts = []
            for (let page = 1; page <= 10; page += 1) {
              const url = new URL(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${runId}/artifacts`)
              url.searchParams.set('per_page', '100')
              url.searchParams.set('page', String(page))
              const response = await fetch(url, {
                headers: {
                  accept: 'application/vnd.github+json',
                  authorization: `Bearer ${process.env.GH_TOKEN}`,
                  'x-github-api-version': '2022-11-28',
                },
              })
              if (!response.ok) throw new Error('artifact list request failed')
              const body = await response.json()
              if (!Array.isArray(body.artifacts)) throw new Error('artifact list response invalid')
              artifacts.push(...body.artifacts)
              if (body.artifacts.length < 100) break
              if (page === 10) throw new Error('artifact list pagination exceeded')
            }
            const candidatesFor = (prefix) => artifacts.flatMap((artifact) => {
              const match = new RegExp(`^${prefix}(\\d+)-${service}$`).exec(artifact.name ?? '')
              if (!match || artifact.expired || !Number.isSafeInteger(Number(artifact.id)) ||
                  Number(match[1]) >= attempt) return []
              return [{ id: Number(artifact.id), attempt: Number(match[1]), createdAt: artifact.created_at ?? '' }]
            }).sort((left, right) => right.attempt - left.attempt || right.createdAt.localeCompare(left.createdAt))
            const checkpoints = candidatesFor(`plan55-service-${runId}-`)
            const starts = candidatesFor(`plan55-start-${runId}-`)
            const selected = checkpoints[0]
            process.stdout.write(`artifact_id=${selected?.id ?? ''}\n`)
            process.stdout.write(`previous_attempt=${selected?.attempt ?? ''}\n`)
            process.stdout.write(`recovery_artifact_ids=${starts.map(({ id }) => id).join(',')}\n`)
            process.stdout.write(`recovery_attempts=${starts.map(({ attempt }) => attempt).join(',')}\n`)
          } catch {
            process.stderr.write('plan55_resume_artifact_lookup_failed\n')
            process.exitCode = 1
          }
          NODE
      - name: Restore exact actor identities from interrupted service starts
        if: steps.resume.outputs.recovery_artifact_ids != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          artifact-ids: ${{ steps.resume.outputs.recovery_artifact_ids }}
          merge-multiple: true
          path: artifacts/plan55-recovery-starts
      - name: Restore this service's prior attempt checkpoint
        if: steps.resume.outputs.artifact_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          artifact-ids: ${{ steps.resume.outputs.artifact_id }}
          merge-multiple: true
          path: .
      - name: Clean interrupted actors and reconcile the restored checkpoint
        if: steps.resume.outputs.recovery_artifact_ids != ''
        env:
          PLAN55_SERVICE: ${{ inputs.service }}
          PLAN55_SOURCE_SHA: ${{ inputs.source_sha }}
          PLAN55_RECOVERY_ATTEMPTS: ${{ steps.resume.outputs.recovery_attempts }}
          PLAN55_PRODUCTION_CANARY_OPT_IN: RUN_ONE_SYNTHETIC_ACTOR_SERVICE
          SUPABASE_URL: https://iwevizmsedyqozxlawwl.supabase.co
          PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs'
          import { resolve } from 'node:path'
          import { spawnSync } from 'node:child_process'
          const service = process.env.PLAN55_SERVICE
          const sourceSha = process.env.PLAN55_SOURCE_SHA?.toLowerCase()
          const runId = process.env.GITHUB_RUN_ID
          const currentAttempt = Number(process.env.GITHUB_RUN_ATTEMPT)
          const expectedAttempts = (process.env.PLAN55_RECOVERY_ATTEMPTS ?? '').split(',').filter(Boolean)
          const fail = () => {
            process.stderr.write('plan55_resume_interrupted_cleanup_failed\n')
            process.exit(1)
          }
          if (!/^[a-f0-9]{40}$/.test(sourceSha ?? '') ||
              !/^(hvac|handyman|cleaning|upholstery|plumbing|electrical)$/.test(service ?? '') ||
              !/^\d+$/.test(runId ?? '') || !Number.isSafeInteger(currentAttempt) || currentAttempt < 2 ||
              expectedAttempts.length === 0 || expectedAttempts.some((value) => !/^\d+$/.test(value))) fail()
          const root = resolve('artifacts/plan55-recovery-starts')
          const walk = (directory) => readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
            const path = resolve(directory, entry.name)
            return entry.isDirectory() ? walk(path) : entry.isFile() ? [path] : []
          })
          let markers
          try {
            const markerFiles = walk(root).filter((path) => /(?:^|[\\/])started-\d+-\d+\.json$/u.test(path))
            if (markerFiles.length !== expectedAttempts.length) fail()
            markers = markerFiles.map((path) => JSON.parse(readFileSync(path, 'utf8')))
              .sort((left, right) => left.attempt - right.attempt)
          } catch {
            fail()
          }
          const actualAttempts = markers.map((marker) => String(marker.attempt)).sort()
          if (new Set(actualAttempts).size !== actualAttempts.length ||
              actualAttempts.join(',') !== [...expectedAttempts].sort().join(',')) fail()
          for (const marker of markers) {
            if (marker.schema !== 'plan55-service-start/v1' ||
                marker.source_sha?.toLowerCase() !== sourceSha || marker.service !== service ||
                marker.run_id !== runId || !Number.isSafeInteger(marker.attempt) ||
                marker.attempt < 1 || marker.attempt >= currentAttempt ||
                !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(marker.actor_id ?? '')) fail()
          }
          const result = spawnSync(process.execPath, [
            'apps/api/scripts/kael-playbook-production-canary.mjs',
            '--recover-interrupted', '--service', service,
          ], {
            cwd: process.cwd(), encoding: 'utf8', input: JSON.stringify({
              schema: 'plan55-interrupted-service-recovery-input/v1', service, markers,
            }), timeout: 180_000, maxBuffer: 1024 * 1024, env: process.env,
          })
          if (result.error || result.status !== 0) fail()
          let recovery
          try {
            recovery = JSON.parse(result.stdout)
          } catch {
            fail()
          }
          if (recovery.schema !== 'plan55-interrupted-service-recovery/v1' ||
              !['RECOVERY_PASS', 'CLEANUP_ONLY_PASS'].includes(recovery.status) ||
              recovery.service !== service || recovery.project_ref !== 'iwevizmsedyqozxlawwl' ||
              recovery.source_sha !== sourceSha || recovery.cleaned_actor_count !== markers.length ||
              !Array.isArray(recovery.cleaned_actor_sha256) ||
              recovery.cleaned_actor_sha256.length !== markers.length) fail()
          NODE
      - name: Resume only from an exact-source checkpoint with verified cleanup
        if: steps.resume.outputs.artifact_id != ''
        env:
          PLAN55_SERVICE: ${{ inputs.service }}
          PLAN55_SOURCE_SHA: ${{ inputs.source_sha }}
          PLAN55_PREVIOUS_ATTEMPT: ${{ steps.resume.outputs.previous_attempt }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'
          import { resolve } from 'node:path'
          import { assertPlan55ReusableServiceAttempt } from './apps/api/scripts/lib/plan55-production-canary-core.mjs'
          const service = process.env.PLAN55_SERVICE
          const sourceSha = process.env.PLAN55_SOURCE_SHA?.toLowerCase()
          const runId = process.env.GITHUB_RUN_ID
          const attempt = process.env.PLAN55_PREVIOUS_ATTEMPT
          const fail = () => {
            process.stderr.write('plan55_resume_prior_attempt_not_reusable\n')
            process.exit(1)
          }
          if (!/^[a-f0-9]{40}$/i.test(sourceSha ?? '') ||
              !/^(hvac|handyman|cleaning|upholstery|plumbing|electrical)$/.test(service ?? '') ||
              !/^\d+$/.test(runId ?? '') || !/^\d+$/.test(attempt ?? '')) fail()
          const release = JSON.parse(readFileSync('artifacts/release/release.json', 'utf8'))
          if (release.gitSha !== sourceSha || release.releaseLane !== 'plan55-production-only' ||
              typeof release.releaseId !== 'string') fail()
          let record = null
          try {
            const path = resolve('.scratch/plan55-production-canary/attempts', sourceSha, service,
              `attempt-${runId}-${attempt}.json`)
            record = JSON.parse(readFileSync(path, 'utf8'))
          } catch (error) {
            if (error?.code !== 'ENOENT') fail()
          }
          let recovery = null
          try {
            recovery = JSON.parse(readFileSync(resolve('.scratch/plan55-production-canary/attempts', sourceSha,
              service, `recovered-${runId}-by-${process.env.GITHUB_RUN_ATTEMPT}.json`), 'utf8'))
          } catch (error) {
            if (error?.code !== 'ENOENT') fail()
          }
          const checkpointRun = spawnSync(process.execPath, [
            'apps/api/scripts/kael-playbook-production-canary.mjs', '--checkpoint-status', '--service', service,
          ], { encoding: 'utf8', maxBuffer: 1024 * 1024, stdio: ['ignore', 'pipe', 'ignore'], timeout: 30000 })
          if (checkpointRun.error || checkpointRun.status !== 0) fail()
          let checkpointStatus
          try {
            checkpointStatus = JSON.parse(checkpointRun.stdout)
          } catch {
            fail()
          }
          try {
            assertPlan55ReusableServiceAttempt({
              attempt: record,
              checkpointStatus,
              service,
              sourceSha,
              releaseId: release.releaseId,
              recovery,
            })
          } catch {
            fail()
          }
          NODE
      - name: Restore only the already completed service receipts
        if: inputs.service != 'hvac'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ inputs.prior_artifact_ids }}
          merge-multiple: true
          path: .
      - name: Mark this service attempt before any Production account or traffic action
        id: started
        env:
          PLAN55_SERVICE: ${{ inputs.service }}
          PLAN55_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          marker_dir=".scratch/plan55-production-canary/attempts/$PLAN55_SOURCE_SHA/$PLAN55_SERVICE"
          mkdir -p "$marker_dir"
          node --input-type=module <<'NODE'
          import { randomUUID } from 'node:crypto'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs'
          import { resolve } from 'node:path'
          const release = JSON.parse(readFileSync('artifacts/release/release.json', 'utf8'))
          const sourceSha = process.env.PLAN55_SOURCE_SHA
          const service = process.env.PLAN55_SERVICE
          const runId = process.env.GITHUB_RUN_ID
          const attempt = process.env.GITHUB_RUN_ATTEMPT
          if (!/^[a-f0-9]{40}$/i.test(sourceSha ?? '') ||
              !/^(hvac|handyman|cleaning|upholstery|plumbing|electrical)$/.test(service ?? '') ||
              !/^\d+$/.test(runId ?? '') || !/^\d+$/.test(attempt ?? '') || !process.env.GITHUB_OUTPUT ||
              release.gitSha?.toLowerCase() !== sourceSha.toLowerCase() ||
              release.releaseLane !== 'plan55-production-only' ||
              !new RegExp(`^harness-${sourceSha.slice(0, 12)}-[a-f0-9]{12}$`, 'i').test(release.releaseId ?? '')) process.exit(1)
          const actorId = randomUUID()
          const marker = {
            schema: 'plan55-service-start/v1',
            source_sha: sourceSha.toLowerCase(),
            service,
            release_id: release.releaseId,
            run_id: runId,
            attempt: Number(attempt),
            actor_id: actorId,
          }
          const path = resolve('.scratch/plan55-production-canary/attempts', sourceSha, service,
            `started-${runId}-${attempt}.json`)
          writeFileSync(path, `${JSON.stringify(marker)}\n`, { flag: 'wx', mode: 0o600 })
          appendFileSync(process.env.GITHUB_OUTPUT, `actor_id=${actorId}\n`, 'utf8')
          NODE
      - name: Preserve the service start marker before canary execution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plan55-start-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.service }}
          path: .scratch/plan55-production-canary/attempts/${{ inputs.source_sha }}/${{ inputs.service }}/started-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Run one service and capture only a scrubbed receipt or safe failure code
        env:
          PLAN55_SERVICE: ${{ inputs.service }}
          PLAN55_SOURCE_SHA: ${{ inputs.source_sha }}
          PLAN55_CANARY_ACTOR_ID: ${{ steps.started.outputs.actor_id }}
          PLAN55_PRODUCTION_CANARY_OPT_IN: RUN_ONE_SYNTHETIC_ACTOR_SERVICE
          SUPABASE_URL: https://iwevizmsedyqozxlawwl.supabase.co
          PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        # Leave 30 minutes beyond cleanup for setup, preflight, and artifact upload; recovery skips validated slices after timeout.
        timeout-minutes: 310
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$PLAN55_SOURCE_SHA"
          case "$PLAN55_SERVICE" in hvac|handyman|cleaning|upholstery|plumbing|electrical) ;; *) exit 1 ;; esac
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const release = JSON.parse(readFileSync('artifacts/release/release.json', 'utf8'))
          const hosted = JSON.parse(readFileSync('artifacts/release/hosted-guard-deployed.json', 'utf8'))
          if (release.gitSha !== process.env.GITHUB_SHA || release.releaseLane !== 'plan55-production-only' ||
              hosted.gitSha !== process.env.GITHUB_SHA || hosted.releaseId !== release.releaseId ||
              hosted.projectRef !== 'iwevizmsedyqozxlawwl') process.exit(1)
          NODE
          mkdir -p ".scratch/plan55-production-canary/attempts/$GITHUB_SHA/$PLAN55_SERVICE"
          raw_attempt_dir="$(mktemp -d "$RUNNER_TEMP/plan55-canary-${PLAN55_SERVICE}.XXXXXX")"
          result_file="$raw_attempt_dir/result.json"
          error_file="$raw_attempt_dir/stderr.txt"
          set +e
          node apps/api/scripts/kael-playbook-production-canary.mjs --run --service "$PLAN55_SERVICE" \
            > "$result_file" 2> "$error_file"
          exit_code=$?
          set -e
          export PLAN55_EXIT_CODE="$exit_code" PLAN55_RESULT_FILE="$result_file" PLAN55_ERROR_FILE="$error_file"
          node --input-type=module <<'NODE'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs'
          import { dirname, resolve } from 'node:path'
          const service = process.env.PLAN55_SERVICE
          const sourceSha = process.env.PLAN55_SOURCE_SHA
          const code = Number(process.env.PLAN55_EXIT_CODE)
          if (!/^[a-f0-9]{40}$/i.test(sourceSha ?? '') ||
              !/^(hvac|handyman|cleaning|upholstery|plumbing|electrical)$/.test(service ?? '') ||
              !Number.isSafeInteger(code) || code < 0 || code > 255) process.exit(1)
          let result = null
          if (code === 0) {
            result = JSON.parse(readFileSync(process.env.PLAN55_RESULT_FILE, 'utf8'))
            if (result.services?.length !== 1 || result.services[0].service !== service ||
                !['G5_PASSED', 'G5_FAILED_SERVICE_OFF'].includes(result.services[0].status)) process.exit(1)
          }
          const rawCode = readFileSync(process.env.PLAN55_ERROR_FILE, 'utf8').trim().split(/\r?\n/).at(-1) ?? ''
          const failureCode = rawCode.match(/^(plan55_[a-z0-9_]+)(?::.*)?$/i)?.[1] ?? 'plan55_canary_unverified'
          const record = {
            schema: 'plan55-service-attempt/v1',
            source_sha: sourceSha.toLowerCase(),
            service,
            status: code === 0 ? 'RECEIPT_RECORDED' : 'BLOCKED_UNVERIFIED',
            ...(code === 0 ? { result } : { error_code: failureCode }),
            exit_code: code,
          }
          const path = resolve('.scratch/plan55-production-canary/attempts', sourceSha, service,
            `attempt-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}.json`)
          mkdirSync(dirname(path), { recursive: true })
          writeFileSync(path, `${JSON.stringify(record, null, 2)}\n`, { flag: 'wx' })
          NODE
          if [ "$exit_code" -ne 0 ]; then
            code=$(tail -n 1 "$error_file" | sed -nE 's/^(plan55_[a-zA-Z0-9_]+)(:.*)?$/\1/p' || true)
            echo "::error title=Plan 55 service BLOCKED/UNVERIFIED::$PLAN55_SERVICE ${code:-plan55_canary_unverified}"
            exit "$exit_code"
          fi
      - name: Always remove the scoped actor flag and prove Auth and row cleanup
        id: cleanup
        if: always() && steps.started.outputs.actor_id != ''
        timeout-minutes: 20
        env:
          PLAN55_SERVICE: ${{ inputs.service }}
          PLAN55_SOURCE_SHA: ${{ inputs.source_sha }}
          PLAN55_CANARY_ACTOR_ID: ${{ steps.started.outputs.actor_id }}
          PLAN55_PRODUCTION_CANARY_OPT_IN: RUN_ONE_SYNTHETIC_ACTOR_SERVICE
          SUPABASE_URL: https://iwevizmsedyqozxlawwl.supabase.co
          PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          marker_dir=".scratch/plan55-production-canary/attempts/$PLAN55_SOURCE_SHA/$PLAN55_SERVICE"
          mkdir -p "$marker_dir"
          result_file="$(mktemp "$RUNNER_TEMP/plan55-cleanup-${PLAN55_SERVICE}.XXXXXX")"
          error_file="$(mktemp "$RUNNER_TEMP/plan55-cleanup-error-${PLAN55_SERVICE}.XXXXXX")"
          set +e
          node apps/api/scripts/kael-playbook-production-canary.mjs \
            --cleanup-only --service "$PLAN55_SERVICE" --actor-id "$PLAN55_CANARY_ACTOR_ID" \
            > "$result_file" 2> "$error_file"
          exit_code=$?
          set -e
          export PLAN55_CLEANUP_EXIT_CODE="$exit_code" PLAN55_CLEANUP_RESULT_FILE="$result_file" PLAN55_CLEANUP_ERROR_FILE="$error_file"
          node --input-type=module <<'NODE'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs'
          import { dirname, resolve } from 'node:path'
          const sourceSha = process.env.PLAN55_SOURCE_SHA
          const service = process.env.PLAN55_SERVICE
          const runId = process.env.GITHUB_RUN_ID
          const attempt = process.env.GITHUB_RUN_ATTEMPT
          const code = Number(process.env.PLAN55_CLEANUP_EXIT_CODE)
          if (!/^[a-f0-9]{40}$/i.test(sourceSha ?? '') ||
              !/^(hvac|handyman|cleaning|upholstery|plumbing|electrical)$/.test(service ?? '') ||
              !/^\d+$/.test(runId ?? '') || !/^\d+$/.test(attempt ?? '') ||
              !Number.isSafeInteger(code) || code < 0 || code > 255) process.exit(1)
          const requiredRows = [
            'profiles', 'customer_profiles', 'customer_account_deletion_requests',
            'kael_chat_sessions', 'kael_chat_turns', 'worker_profiles', 'jobs_as_customer',
            'jobs_as_worker', 'job_broadcasts_as_worker', 'job_events_as_actor',
            'chat_messages_as_sender', 'notifications_as_user',
          ]
          let cleanup = null
          let failureCode = null
          if (code === 0) {
            try {
              const result = JSON.parse(readFileSync(process.env.PLAN55_CLEANUP_RESULT_FILE, 'utf8'))
              const proof = result.cleanup
              const rowsAreZero = proof?.rows && Object.keys(proof.rows).length === requiredRows.length &&
                requiredRows.every((name) => proof.rows[name] === 0)
              if (result.schema !== 'plan55-service-cleanup/v1' || result.status !== 'CLEANUP_PASS' ||
                  result.project_ref !== 'iwevizmsedyqozxlawwl' || result.service !== service ||
                  proof?.globalFlags !== 'absent' || proof?.canaryFlag !== 'absent' ||
                  proof?.canaryActorId !== 'absent' || proof?.authStatus !== 404 ||
                  proof?.orphanWorkers !== 0 || !rowsAreZero) {
                throw new Error('plan55_canary_cleanup_proof_invalid')
              }
              cleanup = proof
            } catch {
              failureCode = 'plan55_canary_cleanup_proof_invalid'
            }
          } else {
            const lastLine = readFileSync(process.env.PLAN55_CLEANUP_ERROR_FILE, 'utf8').trim().split(/\r?\n/).at(-1) ?? ''
            failureCode = lastLine.match(/^(plan55_[a-z0-9_]+)(?::.*)?$/i)?.[1] ?? 'plan55_canary_cleanup_unverified'
          }
          const record = {
            schema: 'plan55-service-cleanup-record/v1',
            source_sha: sourceSha.toLowerCase(),
            service,
            status: failureCode ? 'BLOCKED_UNVERIFIED' : 'CLEANUP_PASS',
            ...(failureCode ? { error_code: failureCode } : { cleanup }),
          }
          const path = resolve('.scratch/plan55-production-canary/attempts', sourceSha, service,
            `cleanup-${runId}-${attempt}.json`)
          mkdirSync(dirname(path), { recursive: true })
          writeFileSync(path, `${JSON.stringify(record, null, 2)}\n`, { flag: 'wx' })
          if (failureCode) {
            process.stderr.write(`${failureCode}\n`)
            process.exit(1)
          }
          NODE
      - name: Preserve this service receipt and attempt evidence
        id: service-artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plan55-service-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.service }}
          path: |
            .scratch/plan55-production-canary/records/**
            .scratch/plan55-production-canary/attempts/**
            docs/test-logs/plan55/${{ inputs.source_sha }}/${{ inputs.service }}/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
