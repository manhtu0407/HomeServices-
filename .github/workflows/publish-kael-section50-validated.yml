name: Publish validated Kael Agentic Completeness Section 50

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: kael-section50-publish-validated
  cancel-in-progress: false

jobs:
  publish:
    if: github.head_ref == 'tmp/kael-section50-materialize-20260807-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VALIDATED_TRANSPORT_SHA: 402c2c95c7e8cc7e65b13f910f3939c34fc87334
      BASE_SHA: 81e5cda85a3928b8540e103774a6049dfdc6bf65
      FINAL_BRANCH: feat/kael-agentic-completeness-section50-final-v2
      PATCH_FILES: '83'
      PATCH_XZ_SHA256: 7aec8b767e6e05fa8472e070c91417dc1f649bb61f3a8b28e5e9b55d134ccd2d
      PATCH_SHA256: e70939231b85308a4c744199d7ae3ed081b93f2fa7fa634695a0e9be5acd5114
      DEFERRED_WORKFLOW: .github/workflows/kael-agentic-completeness.yml
    steps:
      - name: Check out the exact source proven green by run 31187990759
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.VALIDATED_TRANSPORT_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct the validated implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATED_TRANSPORT_SHA"
          cat .github/transport/kael-section50-part-* > /tmp/kael-section50.patch.xz.b64
          cp .github/transport/kael-section50-fix-*.patch /tmp/
          test "$(find /tmp -maxdepth 1 -type f -name 'kael-section50-fix-*.patch' | wc -l | tr -d ' ')" = '8'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/kael-section50.patch.xz.b64')
          data = path.read_bytes()
          if len(data) == 66447:
              data = data[:8497] + b'l' + data[8497:]
          if len(data) != 66448:
              raise SystemExit(f'unexpected transport length: {len(data)}')
          path.write_bytes(data)
          PY
          base64 --decode /tmp/kael-section50.patch.xz.b64 > /tmp/kael-section50.patch.xz
          echo "$PATCH_XZ_SHA256  /tmp/kael-section50.patch.xz" | sha256sum -c -
          xz --test /tmp/kael-section50.patch.xz
          xz --decompress --stdout /tmp/kael-section50.patch.xz > /tmp/kael-section50.patch
          echo "$PATCH_SHA256  /tmp/kael-section50.patch" | sha256sum -c -
          test "$(grep -c '^diff --git ' /tmp/kael-section50.patch)" = "$PATCH_FILES"
          {
            grep '^diff --git ' /tmp/kael-section50.patch
            grep -h '^diff --git ' /tmp/kael-section50-fix-*.patch
          } | awk '{print $4}' | sed 's#^b/##' | sort -u > /tmp/validated-paths.txt

      - name: Apply to the exact main base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git reset --hard "$BASE_SHA"
          git apply --check /tmp/kael-section50.patch
          git apply --index --whitespace=nowarn /tmp/kael-section50.patch
          for fix in /tmp/kael-section50-fix-*.patch; do
            git apply --check "$fix"
            git apply --index --whitespace=nowarn "$fix"
          done
          git diff --cached --check
          git diff --cached --name-only | sort -u > /tmp/staged-paths.txt
          diff -u /tmp/validated-paths.txt /tmp/staged-paths.txt

      - name: Enforce safety boundaries and defer the workflow file
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --name-status | grep -q '^D'; then
            echo 'Tracked file deletion detected.' >&2
            exit 1
          fi
          locked='^(CLAUDE\.md|README\.md|governance/(STRUCTURES|RULES|critical|design)\.md)$'
          if git diff --cached --name-only | grep -Eq "$locked"; then
            echo 'Locked governance file modified.' >&2
            exit 1
          fi
          test -z "$(git diff --cached --name-only -- apps/api/src/app/admin/kael-learning)"
          git restore --staged "$DEFERRED_WORKFLOW"
          rm -f "$DEFERRED_WORKFLOW"
          grep -vxF "$DEFERRED_WORKFLOW" /tmp/validated-paths.txt > /tmp/push-paths.txt
          git diff --cached --name-only | sort -u > /tmp/actual-push-paths.txt
          diff -u /tmp/push-paths.txt /tmp/actual-push-paths.txt
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Commit and push the validated source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git commit -m 'feat(kael): complete Agentic Completeness section 50'
          git push origin "HEAD:refs/heads/${FINAL_BRANCH}"
          echo "implementation_commit=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "implementation_branch=${FINAL_BRANCH}" >> "$GITHUB_STEP_SUMMARY"
          echo "pushed_files=$(wc -l < /tmp/push-paths.txt | tr -d ' ')" >> "$GITHUB_STEP_SUMMARY"
          echo "deferred_workflow=${DEFERRED_WORKFLOW}" >> "$GITHUB_STEP_SUMMARY"
