# React Doctor regression gate.
# The runner pins `--blocking none`, so react-doctor always exits 0 — this job reads the
# per-rule counts instead. Four rules are held at zero (one-platform shadows and per-render
# allocations); everything else is capped by a total budget.
# Reasons for the accepted findings: docs/audit/react-doctor-accepted-findings-20260812.md
name: react-doctor

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget:
    name: no one-platform shadows, no budget growth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Check rule counts
        run: node scripts/check-react-doctor-budget.mjs
