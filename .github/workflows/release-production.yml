name: release-production

on:
  # Pushes to main run quality checks only; Production releases use the local runner.
  push:
    branches: [main]
  schedule:
    # Recovers a cancelled canary. The candidate cohort is synthetic, so real users stay on the
    # active release. The local release preflight blocks while any candidate remains; this run is
    # the recovery path. Every run bills at least a minute, so this only bounds how long a
    # cancelled candidate lingers.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  stale-canary-reconciler:
    name: reconcile a cancelled or timed-out Stage 1 candidate
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reads Production but changes nothing, so it must not be recorded as a deployment;
    # otherwise a failed check here marks the whole Production environment as failed.
    environment:
      name: production
      deployment: false
    env:
      PRODUCTION_PROJECT_REF: iwevizmsedyqozxlawwl
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: CAS-reconcile only a server-proven stale candidate
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p artifacts/release
          node scripts/harness/release-control.mjs \
            --action reconcile-stale --environment production \
            --project-ref "$PRODUCTION_PROJECT_REF" \
            > artifacts/release/stale-reconcile.json
          node -e "const r=require('./artifacts/release/stale-reconcile.json');if(r.mode==='release_control_schema_not_installed')console.log('::notice title=Release control not installed::Production has no '+r.table+' table, so no stale candidate can exist.')"
      - name: Upload stale-candidate reconciliation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage1-stale-reconcile-${{ github.run_id }}
          path: artifacts/release/stale-reconcile.json
          if-no-files-found: error
          retention-days: 90

  quality:
    name: quality, security, integration, SQL, and immutable-source gates
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify immutable main identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      # The behavioral gate below cannot pass while any transaction entry is unmapped, and that is
      # known from the manifest alone, so fail here instead of after the whole-workspace tests.
      - name: Require every transaction entry to be mapped before running tests
        run: node scripts/harness/transaction-critical-coverage.mjs --require-mapped
      - run: pnpm install --frozen-lockfile
      - name: Whole-workspace quality gates
        run: |
          pnpm type-check
          mkdir -p artifacts/transactions
          pnpm test:api --reporter=default --reporter=json --outputFile=../../artifacts/transactions/api-vitest.json
          pnpm test:shared
          pnpm test:system-monitor-worker
          pnpm test:mobile --runInBand --json --outputFile=../../artifacts/transactions/mobile-jest.json
          pnpm test:sandbox
          pnpm build
          pnpm lint:comments
          pnpm lint:structure
          pnpm lint:workplan
          pnpm lint:production-ui-copy -- --output artifacts/release/production-ui-normality.json
          pnpm lint:test-collection
          pnpm skills:check
          pnpm skills:contracts
          pnpm runners:check
          pnpm doctor:react
      - name: Require executed transaction behavior before release mutation
        run: |
          node scripts/harness/transaction-critical-coverage.mjs --require-behavioral \
            --results artifacts/transactions/api-vitest.json \
            --results artifacts/transactions/mobile-jest.json
      - name: Preserve transaction runner evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-transaction-assertions-${{ github.sha }}
          path: artifacts/transactions/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Harness, access, capability, migration, and release gates
        run: |
          pnpm harness:verify
          pnpm harness:manifest:check
          pnpm harness:pillars:check
          pnpm harness:capabilities:check
          pnpm harness:privileged:check
          pnpm harness:access:check
          pnpm harness:migrations:check
          pnpm harness:reliability:check
          pnpm harness:promotion:check
      - name: Edge Deno checks
        run: pnpm edge:check
      - name: Deterministic Kael gates
        run: |
          node apps/api/scripts/kael-eval.mjs --mode deterministic --report /tmp/kael-eval.md
          node apps/api/scripts/kael-multi-turn-eval.mjs
          node apps/api/scripts/kael-model-health.mjs --list
          node apps/api/scripts/kael-model-health.mjs --self-test
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: config/security/gitleaks.toml
      # supabase start on the raw directory replays every migration file by name, including the older
      # copies of an equivalence group that refer to objects a later file creates. The pull-request lanes
      # replay the canonical inventory instead, and so must this job.
      - name: Prepare canonical empty-reset migration workdir
        run: |
          node scripts/harness/prepare-migration-workdir.mjs \
            --empty-reset \
            --inventory config/harness/migration-inventory.json \
            --output artifacts/empty-reset
      - name: Start isolated local Supabase
        run: pnpm --filter @nestscout/api exec supabase --workdir "$GITHUB_WORKSPACE/artifacts/empty-reset" start
      - name: Replay migrations from empty state
        run: pnpm --filter @nestscout/api exec supabase --workdir "$GITHUB_WORKSPACE/artifacts/empty-reset" db reset --local
      - name: Local integration pillar
        env:
          NESTSCOUT_ENVIRONMENT: local
        run: pnpm --filter @nestscout/api exec vitest run --passWithNoTests=false src/__tests__/integration
      - name: run-sql-tests
        env:
          NESTSCOUT_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
        run: node scripts/run.mjs docker/scripts/run-sql-tests --stop-on-first-failure
      - name: Generated database types and schema lint
        run: |
          pnpm --filter @nestscout/api exec supabase --workdir "$GITHUB_WORKSPACE/artifacts/empty-reset" gen types typescript --local > /tmp/database.types.ts
          node -e "const fs=require('node:fs');const p='/tmp/database.types.ts';const t=fs.readFileSync(p,'utf8');fs.writeFileSync(p,t.replace(/\\n+$/u,'\\n'))"
          node scripts/split-database-types.mjs --join > /tmp/rejoined.types.ts
          cmp /tmp/rejoined.types.ts /tmp/database.types.ts
          pnpm --filter @nestscout/api exec supabase --workdir "$GITHUB_WORKSPACE/artifacts/empty-reset" db lint --local --fail-on warning
      - name: Record quality receipt
        run: |
          mkdir -p artifacts/release
          node -e "require('node:fs').writeFileSync('artifacts/release/quality.json', JSON.stringify({gitSha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,status:'passed',gates:['workspace-typecheck','workspace-tests','workspace-build','security','harness','edge-deno','database-reset','local-integration','sql-verification','generated-types']},null,2)+'\n')"
      - name: Upload quality evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage1-quality-${{ github.run_id }}
          path: |
            artifacts/release/quality.json
            artifacts/release/production-ui-normality.json
            /tmp/kael-eval.md
            /tmp/database.types.ts
          if-no-files-found: error
          retention-days: 30
