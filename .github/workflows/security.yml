# S5 (Plan.md §38 security hardening): CI guardrails against regressions.
#  - gitleaks: blocks committed secrets (RULES #1).
#  - security-tests: PII-log lint (RULES #9) + authz-coverage + negative security tests.
# Advisor re-baseline after DDL stays a manual step (needs project credentials) — see
# docs/audit/security-audit-20260614.md.
name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  materialize-harness-assurance:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/harness-production-assurance-pr02-pr12'
    name: materialize verified PR02-PR12 implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: feat/harness-production-assurance-pr02-pr12
          fetch-depth: 0
      - name: Apply checksum-pinned implementation patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/agent-patch-correct -maxdepth 1 -type f -name 'patch-[0-9][0-9][0-9]' | wc -l)" -eq 18
          cat .github/agent-patch-correct/patch-[0-9][0-9][0-9] > /tmp/harness.patch.b64
          echo "871eb95ec8f3f7fb1b927a65fe33541fbc7d38b3f50fb25f853a1f0e1fe872f4  /tmp/harness.patch.b64" | sha256sum -c -
          base64 --decode /tmp/harness.patch.b64 > /tmp/harness.patch.xz
          echo "30a0e14d9d73eae51bae897fd4af4d23b28c98f519e962ff2c4e8bb404d568f2  /tmp/harness.patch.xz" | sha256sum -c -
          xz --test /tmp/harness.patch.xz
          xz --decompress --stdout /tmp/harness.patch.xz > /tmp/harness.patch
          echo "601d441aff25afdb1ba6babc3ad650dba901f688e139835feb6ce426e6b3be2f  /tmp/harness.patch" | sha256sum -c -
          git reset --hard d0f465c29d86a9aeb94992a58f990ea567657c4c
          git apply --check /tmp/harness.patch
          git apply --index /tmp/harness.patch
          test -f scripts/harness/verify.mjs
          test -f .github/workflows/harness-assurance.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 111
          if git ls-files '.github/agent-patch*' | grep -q .; then
            echo "temporary transport files leaked into implementation tree" >&2
            exit 1
          fi
          node scripts/harness/verify.mjs
          git diff --cached --check
          git config user.name "manhtu0407"
          git config user.email "manhtu0407@gmail.com"
          tree_sha="$(git write-tree)"
          commit_sha="$(printf '%s\n\n%s\n' \
            'feat(harness): complete production assurance controls PR-02 through PR-12' \
            'Implement environment, authorization, privileged access, data policy, release, tracing, evaluation, learning, reliability, promotion, rollback, incident, and SLO controls.' \
            | git commit-tree "$tree_sha" -p d0f465c29d86a9aeb94992a58f990ea567657c4c)"
          git push --force origin "$commit_sha:refs/heads/feat/harness-production-assurance-pr02-pr12"

  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: config/security/gitleaks.toml

  security-tests:
    name: PII-log lint + authz/negative security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Security guardrail tests
        run: >
          pnpm --filter @nestscout/api exec vitest run
          foundation
          route-security
          mobile-api-s2-learning-candidate-authz
          mobile-api-s2-system-prompt-security
          mobile-api-s3-authz-coverage
          mobile-api-s3-require-job-access
          mobile-api-s4-spend-gate
          kael-redteam

  ratchets:
    name: harness manifest + skills-sync + structure ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Harness manifest fixture tests
        run: node --test scripts/harness/check-manifest.test.mjs
      - name: Harness manifest semantic check
        run: node scripts/harness/check-manifest.mjs
      - name: Skills single-source check
        run: node scripts/check-skills-sync.mjs
      - name: Structure ratchet (Core Skill 6)
        run: node scripts/lint-structure.mjs
