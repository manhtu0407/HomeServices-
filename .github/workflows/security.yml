# S5 (Plan.md §38 security hardening): CI guardrails against regressions.
#  - gitleaks: blocks committed secrets (RULES #1).
#  - security-tests: PII-log lint (RULES #9) + authz-coverage + negative security tests.
# Advisor re-baseline after DDL stays a manual step (needs project credentials) — see
# docs/audit/security-audit-20260614.md.
name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # gitleaks-action@v2 (PR mode) reads the PR commit list via the GitHub API;
  # without this it 403s with "Resource not accessible by integration" before
  # scanning. Required scope per the API's x-accepted-github-permissions header.
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: config/security/gitleaks.toml

  security-tests:
    name: PII-log lint + authz/negative security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Security guardrail tests
        run: >
          pnpm --filter @nestscout/api exec vitest run
          foundation
          route-security
          mobile-api-s2-learning-candidate-authz
          mobile-api-s2-system-prompt-security
          mobile-api-s3-authz-coverage
          mobile-api-s3-require-job-access
          mobile-api-s4-spend-gate
          kael-redteam

  ratchets:
    name: harness manifest + skills-sync + structure ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Harness manifest semantic check
        run: node scripts/harness/check-manifest.mjs
      - name: Skills single-source check
        run: node scripts/check-skills-sync.mjs
      - name: Skill contract ratchet
        run: node scripts/check-skill-contracts.mjs
      - name: Runner parity ratchet
        run: node scripts/check-runner-parity.mjs
      - name: Structure ratchet (Core Skill 6)
        run: node scripts/lint-structure.mjs
      - name: Artifact-text assertion ratchet
        run: node scripts/find-artifact-text-assertions.mjs
      - name: Pillar registry ratchet
        run: node scripts/harness/pillar-registry.mjs
