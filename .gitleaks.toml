# S5 (Plan.md §38): gitleaks config for the security CI job.
# Extends the default rule set (which detects provider keys, JWTs, sbp_ tokens, etc.)
# and allowlists known-safe, non-secret fixtures so CI does not false-positive.
title = "Home Services gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allow key-name-only env templates and obviously-fake test fixtures"
paths = [
  '''\.env\.example$''',
  '''.*/__tests__/.*''',
  '''.*\.test\.(ts|tsx)$''',
  '''packages/shared/src/types/database\.types\.ts$''',
  '''pnpm-lock\.yaml$''',
]
# Fake credentials used in unit-test fixtures (never real secrets).
regexes = [
  '''(test-key|test-service-key|test-anon-key|deepseek-ok|anthropic-ok|perplexity-ok)''',
]
