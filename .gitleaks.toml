# S5 (Plan.md §38): gitleaks config for the security CI job.
# Extends the default rule set (which detects provider keys, JWTs, sbp_ tokens, etc.)
# and allowlists known-safe, non-secret fixtures so CI does not false-positive.
title = "Home Services gitleaks config"

[extend]
useDefault = true

[allowlist]
# Codex PR#68 P2: do NOT path-allowlist every test file — a real provider/Supabase key
# accidentally pasted into a test or fixture must still be caught. We allowlist only
# key-name-only templates, generated types, and the lockfile, then rely on fake-value
# regexes for the known placeholder credentials used in unit-test fixtures. (gitleaks'
# default rules only fire on real-key FORMATS, so plain placeholders like `test-key`
# are not flagged in the first place.)
description = "Allow key-name-only env templates, generated types, lockfile, and obviously-fake fixtures"
paths = [
  '''\.env\.example$''',
  '''packages/shared/src/types/database\.types\.ts$''',
  '''pnpm-lock\.yaml$''',
]
# Obviously-fake credentials used in unit-test fixtures (never real secrets).
regexes = [
  '''(test-key|test-service-key|test-anon-key|deepseek-ok|anthropic-ok|perplexity-ok)''',
  '''(?i)\b(fake|dummy|placeholder|example|sample|test|mock)[-_]?(key|token|secret)\b''',
]
