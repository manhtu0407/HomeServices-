appId: ${MAESTRO_APP_ID}
tags:
  - customer
  - normal-account
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: auth-role-gate-screen
    timeout: 45000
- takeScreenshot: customer-role-gate
- tapOn:
    id: auth-entry-role-customer
- tapOn:
    id: auth-entry-role-customer
- extendedWaitUntil:
    visible:
      id: auth-login-1-4
    timeout: 15000
- assertVisible:
    id: auth-client-google-primary
- assertVisible:
    id: auth-client-apple-secondary
- tapOn:
    id: auth-login-email-input
- inputText: ${MAESTRO_CUSTOMER_EMAIL}
- tapOn:
    id: auth-login-password-input
- inputText: ${MAESTRO_CUSTOMER_PASSWORD}
- hideKeyboard
- tapOn:
    id: auth-login-submit
- extendedWaitUntil:
    visible:
      id: customer-v21-home
    timeout: 60000
- longPressOn:
    id: customer-runtime-marker-hotspot
- extendedWaitUntil:
    visible:
      id: customer-runtime-marker
    timeout: 10000
- assertVisible: ".*SHA ${MAESTRO_EXPECTED_GIT_SHORT_SHA}.*"
- assertVisible: ".*Release ${MAESTRO_EXPECTED_RELEASE_ID}.*"
- takeScreenshot: customer-home-release-identity
- stopApp
