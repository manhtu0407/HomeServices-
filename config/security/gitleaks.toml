# S5 (Plan.md §38): gitleaks config for the security CI job.
# Extends the default rule set (which detects provider keys, JWTs, sbp_ tokens, etc.)
# and allowlists obviously-fake fixture values without exempting whole files.
title = "Home Services gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allow obviously-fake fixture values"
# Obviously-fake credentials used in unit-test fixtures (never real secrets).
regexes = [
  '''(test-key|test-service-key|test-anon-key|deepseek-ok|anthropic-ok|perplexity-ok)''',
  '''(?i)\b(fake|dummy|placeholder|example|sample|test|mock)[-_]?(key|token|secret)\b''',
  # Supabase local-stack demo tokens. The base64 fragment below is
  # `{"iss":"supabase-demo` — the CLI signs these with a fixed, published secret,
  # so every machine gets byte-identical tokens and they carry no authority over
  # any hosted project. Matched on the ISSUER, not on a file path: a real key
  # pasted into the same file is still caught, and a demo token is allowed
  # wherever it appears. Anything issued by a real project fails this regex.
  '''eyJpc3MiOiJzdXBhYmFzZS1kZW1v''',
  # Test-pillar ids from a PILLAR manifest's `siblings` list, e.g. `P10-per-actor-rls`.
  # `generic-api-key` matches a keyword, a separator, then a value: an id such as
  # `P19-job-access-ownership` supplies the keyword `access`, the list comma supplies the
  # separator, and the next id in the list is read as the value. Anchored to the id shape the
  # registry already enforces (`scripts/harness/pillar-registry.mjs`), so it allows exactly
  # `P<nn>-<kebab>` and nothing else — a real key sharing the line is still caught.
  '''^P\d{2}-[a-z0-9]+(?:-[a-z0-9]+)*$''',
]
