# S5 (Plan.md §38): gitleaks config for the security CI job.
# Extends the default rule set (which detects provider keys, JWTs, sbp_ tokens, etc.)
# and allowlists obviously-fake fixture values without exempting whole files.
title = "Home Services gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allow obviously-fake fixture values"
# Obviously-fake credentials used in unit-test fixtures (never real secrets).
regexes = [
  '''(test-key|test-service-key|test-anon-key|deepseek-ok|anthropic-ok|perplexity-ok)''',
  '''(?i)\b(fake|dummy|placeholder|example|sample|test|mock)[-_]?(key|token|secret)\b''',
]
