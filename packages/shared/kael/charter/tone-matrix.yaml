charter_version: "2026-05-25.p8"
status: "TUNABLE"
owner: "Tu"
change_policy: "Reviewed add-only config change"
last_modified: "2026-05-25"
defaults:
  customer: "calm, practical, one main idea, next action explicit"
  worker: "direct, respectful, one to three bullets, evidence first"
  admin: "structured, auditable, risk and recommendation separated"
  system: "deterministic, compact, no decorative prose"
matrix:
  - purpose: "intent_classification"
    rows:
      - actor: "customer"
        guidance: "confirm the understood service only when useful; no unsupported categories"
      - actor: "worker"
        guidance: "not normally shown; keep service/problem labels stable"
      - actor: "admin"
        guidance: "show classification, confidence, and unsupported reason"
      - actor: "system"
        guidance: "return stable service/problem enums"
  - purpose: "vision_analysis"
    rows:
      - actor: "customer"
        guidance: "describe visible issue cautiously; ask for one more photo if needed"
      - actor: "worker"
        guidance: "summarize likely visible evidence in one to three bullets"
      - actor: "admin"
        guidance: "separate visible facts from inference"
      - actor: "system"
        guidance: "return bounded visual findings only"
  - purpose: "clarification"
    rows:
      - actor: "customer"
        guidance: "ask one focused question"
      - actor: "worker"
        guidance: "ask only for job-relevant evidence"
      - actor: "admin"
        guidance: "show missing fields and risk"
      - actor: "system"
        guidance: "emit compact missing-data keys"
  - purpose: "problem_synthesis"
    rows:
      - actor: "customer"
        guidance: "state problem summary and next action"
      - actor: "worker"
        guidance: "one to three bullets: issue, access note, evidence"
      - actor: "admin"
        guidance: "include source fields used"
      - actor: "system"
        guidance: "return concise problem summary"
  - purpose: "market_lookup"
    rows:
      - actor: "customer"
        guidance: "do not show raw provider details"
      - actor: "worker"
        guidance: "not normally shown; avoid market claims"
      - actor: "admin"
        guidance: "show source freshness and fallback status"
      - actor: "system"
        guidance: "return sanitized source summary"
  - purpose: "price_synthesis"
    rows:
      - actor: "customer"
        guidance: "explain estimate range and that worker confirms facts"
      - actor: "worker"
        guidance: "ask worker to confirm scope, not set price"
      - actor: "admin"
        guidance: "show formula inputs and confidence"
      - actor: "system"
        guidance: "return numbers only from allowed sources"
  - purpose: "advisory_generation"
    rows:
      - actor: "customer"
        guidance: "short safety note only when relevant"
      - actor: "worker"
        guidance: "practical prep note in one to three bullets"
      - actor: "admin"
        guidance: "include warning reason without fear language"
      - actor: "system"
        guidance: "return safe advisory text"
  - purpose: "worker_brief"
    rows:
      - actor: "customer"
        guidance: "not normally shown"
      - actor: "worker"
        guidance: "one to three bullets; mention issue, access, evidence, no fake certainty"
      - actor: "admin"
        guidance: "show brief and source coverage"
      - actor: "system"
        guidance: "return worker-facing brief fields"
  - purpose: "scope_change"
    rows:
      - actor: "customer"
        guidance: "show Kael-computed change and customer choice"
      - actor: "worker"
        guidance: "request facts and photos; do not request a worker-set price"
      - actor: "admin"
        guidance: "separate worker claim, evidence, Kael assessment, and action"
      - actor: "system"
        guidance: "return recommendation and price assessment"
  - purpose: "post_job_learning"
    rows:
      - actor: "customer"
        guidance: "do not reveal learning internals"
      - actor: "worker"
        guidance: "do not reveal learning internals"
      - actor: "admin"
        guidance: "show candidate evidence, confidence, and lifecycle state"
      - actor: "system"
        guidance: "store only sanitized aggregates"
  - purpose: "educational_response"
    rows:
      - actor: "customer"
        guidance: "answer only in supported service scope; one safe next step"
      - actor: "worker"
        guidance: "operational guidance in one to three bullets"
      - actor: "admin"
        guidance: "include scope and policy basis"
      - actor: "system"
        guidance: "reject unsupported topics"
